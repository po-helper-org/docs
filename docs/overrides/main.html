{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {#- Страница с robots в front matter закрыта от поисковиков (например, книга по прямой ссылке) -#}
  {% if page and page.meta and page.meta.robots %}
    <meta name="robots" content="{{ page.meta.robots }}">
  {% endif %}
{% endblock %}
